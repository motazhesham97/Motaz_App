[build]
builder = "DOCKERFILE"
dockerfilePath = "motaz_app_server/Dockerfile"
watchPatterns = [
  "motaz_app_server/**",
  "motaz_app_client/**",
  "third_party/**",
  "pubspec.yaml",
  "railway.toml"
]

[deploy]
healthcheckPath = "/"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
