class: MonthlyDistribution
table: monthly_distribution
fields:
  id: UuidValue?, defaultPersist=random
  year: int
  month: int
  netSales: int, default=0
  operationalExpenses: int, default=0
  productionExpenses: int, default=0
  profitBeforeCarry: int, default=0
  currentMonthLoss: int, default=0
  carriedLossIn: int, default=0
  carriedLossOut: int, default=0
  netProfit: int
  ownerShare: int
  partnerShare: int
  marginShare: int
  status: RecordStatus, default=ACTIVE
  voidReason: String?
  createdAt: DateTime
  updatedAt: DateTime
  deviceId: UuidValue
  device: Device?, relation(field=deviceId)
  rowVersion: int, default=1
  syncStatus: SyncStatus, default=PENDING
indexes:
  monthly_distribution_sync_cursor_idx:
    fields: rowVersion, id
  monthly_distribution_year_month_idx:
    fields: year, month
    unique: true
  monthly_distribution_status_idx:
    fields: status
