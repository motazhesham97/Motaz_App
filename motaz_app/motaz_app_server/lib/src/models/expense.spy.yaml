class: Expense
table: expense
fields:
  id: UuidValue?, defaultPersist=random
  category: ExpenseCategory
  amount: int
  expenseDate: DateTime
  note: String?
  status: RecordStatus, default=ACTIVE
  voidReason: String?
  createdAt: DateTime
  updatedAt: DateTime
  deviceId: UuidValue
  device: Device?, relation(field=deviceId)
  rowVersion: int, default=1
  syncStatus: SyncStatus, default=PENDING
indexes:
  expense_date_idx:
    fields: expenseDate
  expense_category_idx:
    fields: category
  expense_status_idx:
    fields: status
