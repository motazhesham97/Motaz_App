# Copy to config/passwords.yaml and put real local/deployment secrets there.
# Do not commit config/passwords.yaml.
development:
  database: <your-development-database-password>
  serviceSecret: <your-development-service-secret>
  emailSecretHashPepper: <your-development-email-pepper>
  jwtHmacSha512PrivateKey: <your-development-jwt-private-key>
  jwtRefreshTokenHashPepper: <your-development-refresh-pepper>

test:
  database: <your-test-database-password>
  serviceSecret: <your-test-service-secret>
  emailSecretHashPepper: <your-test-email-pepper>
  jwtHmacSha512PrivateKey: <your-test-jwt-private-key>
  jwtRefreshTokenHashPepper: <your-test-refresh-pepper>

production:
  database: <your-production-database-password>
  serviceSecret: <your-production-service-secret>
  emailSecretHashPepper: <your-production-email-pepper>
  jwtHmacSha512PrivateKey: <your-production-jwt-private-key>
  jwtRefreshTokenHashPepper: <your-production-refresh-pepper>
