# Copy to config/passwords.docker.yaml for local Docker runs.
# Keep the database password in sync with MOTAZ_POSTGRES_PASSWORD.
production:
  database: motaz_docker_password
  serviceSecret: change-this-service-secret
  emailSecretHashPepper: change-this-email-pepper
  jwtHmacSha512PrivateKey: change-this-jwt-private-key
  jwtRefreshTokenHashPepper: change-this-refresh-pepper
