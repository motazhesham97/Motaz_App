# Development configuration for running Serverpod against Neon.
# The database password stays in config/passwords.yaml, which is ignored by git.
apiServer:
  port: 8080
  publicHost: 192.168.8.132
  publicPort: 8080
  publicScheme: http

insightsServer:
  port: 8081
  publicHost: 192.168.8.132
  publicPort: 8081
  publicScheme: http

webServer:
  port: 8082
  publicHost: 192.168.8.132
  publicPort: 8082
  publicScheme: http

logging: normal

sessionLogs:
  persistentEnabled: true
  consoleEnabled: true
  consoleLogFormat: text

futureCallExecutionEnabled: true
futureCall:
  concurrencyLimit: 1
  scanInterval: 5000

database:
  host: ep-round-shadow-abpm7n8k.eu-west-2.aws.neon.tech
  port: 5432
  name: neondb
  user: neondb_owner
  requireSsl: true
  # Serverpod verifies table definitions in parallel during startup.
  # The workspace pins a patched postgres pool timeout so Neon has enough time
  # to open/reuse these remote connections reliably.
  maxConnectionCount: 10

redis:
  enabled: false
  host: localhost
  port: 6379
