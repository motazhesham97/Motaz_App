# Production configuration. Set these environment variables in the deployment
# platform; do not commit Neon or production credentials to this file.
apiServer:
  port: ${SERVERPOD_API_BIND_PORT}
  publicHost: ${SERVERPOD_API_HOST}
  publicPort: ${SERVERPOD_API_PORT}
  publicScheme: ${SERVERPOD_API_SCHEME}

insightsServer:
  port: 8081
  publicHost: ${SERVERPOD_INSIGHTS_HOST}
  publicPort: ${SERVERPOD_INSIGHTS_PORT}
  publicScheme: ${SERVERPOD_INSIGHTS_SCHEME}

webServer:
  port: 8082
  publicHost: ${SERVERPOD_WEB_HOST}
  publicPort: ${SERVERPOD_WEB_PORT}
  publicScheme: ${SERVERPOD_WEB_SCHEME}

database:
  host: ${SERVERPOD_DATABASE_HOST}
  port: ${SERVERPOD_DATABASE_PORT}
  name: ${SERVERPOD_DATABASE_NAME}
  user: ${SERVERPOD_DATABASE_USER}
  requireSsl: ${SERVERPOD_DATABASE_REQUIRE_SSL}
  # Use the direct Neon host for --apply-migrations, not the -pooler host.
  # Serverpod's migration verifier fans out schema queries across tables.
  maxConnectionCount: 10

redis:
  enabled: false
  host: ${SERVERPOD_REDIS_HOST}
  port: ${SERVERPOD_REDIS_PORT}
  # user: ${SERVERPOD_REDIS_USER}
  # requireSsl: true

maxRequestSize: 524288

sessionLogs:
  consoleEnabled: false
  # persistentEnabled: true
  # consoleLogFormat: json

# futureCallExecutionEnabled: true
# futureCall:
#   concurrencyLimit: 1
#   scanInterval: 5000
