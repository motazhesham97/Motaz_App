name: Analyze

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Dart packages
        run: dart analyze motaz_app_client motaz_app_server

      - name: Analyze Flutter app
        run: flutter analyze --no-fatal-infos motaz_app_flutter

